<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Preview — Chat2PDF</title>
  <style>
    /* ================================================
       PREVIEW PAGE STYLES
       Matches the user's desired format:
       - Red headings with colored backgrounds
       - Numbered sections
       - Bold key terms
       - Card-style layout
       - Clean, professional study notes
       ================================================ */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f0f0;
      color: #333;
      line-height: 1.7;
    }

    /* ── Toolbar ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(135deg, #2c2c2c, #111);
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .toolbar-logo {
      font-size: 24px;
      flex-shrink: 0;
    }

    .toolbar-title-input {
      flex: 1;
      min-width: 0;
      padding: 8px 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .toolbar-title-input::placeholder { color: rgba(255,255,255,0.5); }
    .toolbar-title-input:focus { border-color: rgba(255,255,255,0.7); }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .toolbar-btn {
      padding: 8px 20px;
      border: 2px solid white;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-btn:hover {
      background: white;
      color: #111;
    }

    .toolbar-btn.primary {
      background: white;
      color: #111;
      border-color: white;
    }

    .toolbar-btn.primary:hover {
      background: rgba(255,255,255,0.9);
    }

    /* ── Loading State ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #cc0000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 16px;
      color: #888;
    }

    /* ── Notes Container (Card) ── */
    .notes-wrapper {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 20px 60px;
    }

    .notes-container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      border: 1px solid #e5e5e5;
      padding: 32px 38px;
      line-height: 1.6;
      font-size: 13.5px;
      color: #111;
      outline: none;
    }

    .notes-container:focus {
      border-color: #0288d1;
      box-shadow: 0 0 0 2px rgba(2, 136, 209, 0.15), 0 2px 20px rgba(0,0,0,0.08);
    }

    /* ── COLOUR PALETTE ── */
    :root {
      --h1-color:    #1a237e;   /* dark navy blue for main title   */
      --h2-color:    #cc0000;   /* red for section headings        */
      --h3-color:    #cc0000;   /* red for sub-headings            */
      --accent-bdr:  #cc0000;   /* left border on h2               */
      --code-bg:     #f4f4f4;
      --code-border: #cccccc;
    }

    /* ── Title (h1) ── */
    .notes-container h1 {
      color: var(--h1-color);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      border-bottom: 2px solid #1a237e;
      padding-bottom: 7px;
      margin-bottom: 6px;
      margin-top: 0;
    }

    /* ── Section Header (h2) ── */
    .notes-container h2 {
      color: #cc0000;
      font-size: 14px;
      font-weight: 700;
      border-left: 4px solid #cc0000;
      padding: 4px 10px;
      margin-top: 14px;
      margin-bottom: 5px;
      background: none;
    }

    /* ── Sub-section (h3) ── */
    .notes-container h3 {
      color: #0277bd;
      font-size: 13.5px;
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 3px;
    }

    /* ── h4+ ── */
    .notes-container h4 {
      color: #0277bd;
      font-size: 13px;
      font-weight: 700;
      margin-top: 8px;
      margin-bottom: 2px;
    }
    .notes-container h5,
    .notes-container h6 {
      color: #0277bd;
      font-size: 13px;
      font-weight: 600;
      margin-top: 7px;
      margin-bottom: 2px;
    }

    /* ── Paragraphs — tight spacing ── */
    .notes-container p {
      margin-bottom: 4px;
      margin-top: 0;
    }

    /* ── Bold ── */
    .notes-container strong { color: #000; font-weight: 700; }

    /* Strong inside headings must inherit heading color, not override it */
    .notes-container h1 strong,
    .notes-container h2 strong,
    .notes-container h3 strong,
    .notes-container h4 strong,
    .notes-container h5 strong,
    .notes-container h6 strong { color: inherit; }

    /* ── Italic ── */
    .notes-container em { font-style: italic; color: #333; }

    /* ── Links ── */
    .notes-container a { color: #222; text-decoration: underline; }

    /* ── Ordered Lists ── */
    .notes-container ol {
      margin: 3px 0 5px 20px;
      padding: 0;
    }
    .notes-container ol li { margin-bottom: 2px; padding-left: 2px; }

    /* ── Unordered Lists ── */
    .notes-container ul {
      margin: 3px 0 5px 20px;
      padding: 0;
      list-style-type: disc;
    }
    .notes-container ul li { margin-bottom: 2px; padding-left: 2px; }

    /* ── Nested Lists ── */
    .notes-container ol ol, .notes-container ul ul,
    .notes-container ol ul, .notes-container ul ol {
      margin-top: 2px; margin-bottom: 2px;
    }

    /* ── Code Blocks ── */
    .notes-container pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-left: 3px solid #555;
      border-radius: 4px;
      padding: 10px 13px;
      margin: 6px 0;
      overflow-x: auto;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #222;
    }
    .notes-container pre code {
      background: none; padding: 0; border-radius: 0;
      font-size: inherit; color: inherit;
    }

    /* ── Inline Code ── */
    .notes-container code {
      background: #ebebeb;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      color: #111;
    }

    /* ── Tables ── */
    .notes-container table {
      width: 100%;
      border-collapse: collapse;
      margin: 6px 0;
      font-size: 13px;
      border: 2px solid #333;
    }
    .notes-container th {
      background: #333;
      color: white;
      padding: 7px 11px;
      text-align: left;
      font-weight: 600;
      border: 2px solid #333;
    }
    .notes-container td {
      padding: 6px 11px;
      border: 1.5px solid #aaa;
      color: #111;
    }
    .notes-container tr:nth-child(even) td { background: #f5f5f5; }
    .notes-container tr:nth-child(odd) td  { background: #ffffff; }

    /* ── Blockquotes ── */
    .notes-container blockquote {
      border-left: 4px solid #555;
      background: #f5f5f5;
      padding: 7px 13px;
      margin: 6px 0;
      border-radius: 0 4px 4px 0;
      color: #444;
      font-style: italic;
    }
    .notes-container blockquote p { margin-bottom: 3px; }
    .notes-container blockquote p:last-child { margin-bottom: 0; }

    /* ── Horizontal Rules ── */
    .notes-container hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 10px 0;
    }

    /* ── Images ── */
    .notes-container img {
      max-width: 100%; height: auto;
      border-radius: 4px; margin: 5px 0;
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state .emoji {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state h2 {
      font-size: 20px;
      color: #666;
      margin-bottom: 8px;
      background: none;
      border: none;
      padding: 0;
    }

    .empty-state p {
      font-size: 14px;
      color: #999;
    }

    /* ── Print Styles ── */
    @media print {
      body { background: white; }
      .toolbar { display: none !important; }
      .notes-wrapper { margin: 0; padding: 0; max-width: none; }
      .notes-container {
        box-shadow: none;
        border: none;
        border-radius: 0;
        padding: 20px;
      }
      .notes-container pre {
        white-space: pre-wrap;
        word-wrap: break-word;
      }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .toolbar { flex-direction: column; gap: 10px; padding: 12px 16px; }
      .toolbar-left { width: 100%; }
      .toolbar-actions { width: 100%; justify-content: center; }
      .notes-container { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <img src="icons/icon48.png" alt="Chat2PDF" class="toolbar-logo" style="width: 28px; height: 28px; object-fit: contain;">
      <input 
        type="text" 
        class="toolbar-title-input" 
        id="titleInput" 
        placeholder="Enter notes title..."
        spellcheck="false"
      >
    </div>
    <div class="toolbar-actions">
      <button class="toolbar-btn" id="printBtn" title="Print notes">
        🖨️ Print
      </button>
      <button class="toolbar-btn primary" id="downloadBtn" title="Download as PDF">
        ⬇ Download PDF
      </button>
    </div>
  </div>
  <div style="text-align: center; font-size: 12px; color: #777; margin-top: 12px; font-family: inherit;">
    💡 <strong>Tip:</strong> You can click anywhere in the notes below to directly edit text before downloading.
  </div>

  <!-- Content Area -->
  <div class="notes-wrapper" id="notesWrapper">
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <span class="loading-text">Loading your notes...</span>
    </div>
  </div>

  <!-- Load html2pdf.js -->
  <script src="lib/html2pdf.bundle.min.js"></script>
  <script src="preview.js"></script>
</body>
</html>
