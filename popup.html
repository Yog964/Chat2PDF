<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat2PDF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 315px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f4f7;
      color: #222;
      overflow: hidden;
      line-height: 1.4;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #cc0000, #990000);
      color: #ffffff;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(204, 0, 0, 0.25);
    }

    .header-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-text p {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 1px;
    }

    .tag {
      font-size: 9px;
      background: rgba(255, 255, 255, 0.25);
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* ── Content ── */
    .content {
      padding: 10px 10px 6px;
    }

    .guide-card {
      background: transparent;
      border-radius: 14px;
      overflow: hidden;
    }

    .guide-img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      border-radius: 14px;
    }

    /* ── Footer ── */
    .footer {
      padding: 8px 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #e8e8ee;
      background: #ffffff;
      font-size: 11px;
      color: #666;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(34, 197, 94, 0.6);
    }

    .footer-badge {
      font-weight: 600;
      color: #cc0000;
      font-size: 10.5px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img src="icons/icon48.png" alt="Chat2PDF" class="header-icon">
    <div class="header-text">
      <h1>Chat2PDF <span class="tag">v1.0</span></h1>
      <p>Save ChatGPT responses as study-ready PDFs</p>
    </div>
  </div>

  <!-- Content (Image Guide) -->
  <div class="content">
    <div class="guide-card">
      <img src="icons/how-to-use.png" alt="How to Use Chat2PDF" class="guide-img">
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="status">
      <span class="status-dot"></span>
      <span>Active on ChatGPT</span>
    </div>
    <span class="footer-badge">Exam Ready</span>
  </div>
</body>
</html>
